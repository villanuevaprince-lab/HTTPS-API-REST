<h1 class="h2">Post da JSONPlaceholder</h1>
<div class="row g-2 mb-3 align-items-center">
  <div class="col-auto">
    <input #numero type="number" class="form-control" value="1" min="1" aria-label="Numero del post">
  </div>
  <div class="col-auto"><button type="button" class="btn btn-primary" [disabled]="loading()" (click)="caricaUno(numero.value)">Carica un post</button></div>
</div>

@if (loading()) { <div class="spinner-border text-primary mb-3" role="status" aria-label="Caricamento"></div> }
@if (errore(); as messaggio) { <div class="alert alert-danger" role="alert">{{ messaggio }}</div> }

@if (post(); as p) {
  <h2 class="h5">Ultima risposta ricevuta (post n. {{ p.id }})</h2>
  <pre class="bg-body-tertiary p-3 rounded">{{ p | json }}</pre>
}
